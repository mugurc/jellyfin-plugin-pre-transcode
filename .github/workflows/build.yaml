name: '🏗️ Build'

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Install ffmpeg and mkvtoolnix
        # The integration suites locate ffmpeg/ffprobe and skip themselves when the machine has none,
        # reporting a pass without running anything. The runner image ships neither, so install them:
        # apt puts both in /usr/bin, where FfmpegTestBinaries.Find looks first.
        #
        # mkvtoolnix is for the container-crop test (issue #14): mkvpropedit is the only way to author the
        # Matroska PixelCrop elements that reproduce it, since ffmpeg's muxer cannot write them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal
        env:
          PRETRANSCODE_REQUIRE_FFMPEG: '1'
          
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.PreTranscode
          path: Jellyfin.Plugin.PreTranscode/bin/Release/net9.0/Jellyfin.Plugin.PreTranscode.dll
          if-no-files-found: error
